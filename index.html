<!DOCTYPE html>

<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="icon" type="image/png" href="assets/img/icons/logo-itr.png">

    <meta name="description" content="Inicio de sesión del Sistema de Gestión de Inventario I.T.R.">

    <title>
        I.T.R. - Inicio de sesión
    </title>


    <!-- =========================================
         CSS GENERAL
         ========================================= -->

    <link rel="stylesheet" href="css/variables.css">
    <link rel="stylesheet" href="css/reset.css">
    <link rel="stylesheet" href="css/global.css">
    <link rel="stylesheet" href="css/buttons.css">
    <link rel="stylesheet" href="css/modal.css">
    <link rel="stylesheet" href="css/pages.css">

</head>


<body class="auth-page">


    <!-- =========================================
         HEADER
         ========================================= -->

    <div id="auth-header-container"></div>


    <!-- =========================================
         CONTENIDO PRINCIPAL
         ========================================= -->

    <main class="auth-main">


        <section class="login-card" aria-labelledby="login-title">


            <!-- =====================================
                 IDENTIDAD
                 ===================================== -->

            <div class="login-brand">

                <img src="assets/img/icons/logo-itr.png" alt="I.T.R." class="login-logo">

            </div>


            <!-- =====================================
                 BIENVENIDA
                 ===================================== -->

            <div class="login-welcome">

                <h1 id="login-title">

                    Inicio de sesión

                </h1>

                <p>

                    Ingrese sus credenciales para acceder
                    al sistema.

                </p>

            </div>


            <!-- =====================================
                 MENSAJES
                 ===================================== -->

            <div id="authMessage" class="form-message" aria-live="polite" aria-atomic="true" hidden>
            </div>


            <!-- =====================================
                 FORMULARIO
                 ===================================== -->

            <form class="auth-form" id="loginForm" method="POST" action="#" novalidate>


                <!-- USUARIO -->

                <div class="form-group">

                    <label for="username" class="form-label">

                        Usuario

                    </label>

                    <input type="text" id="username" name="username" class="form-input" placeholder="Ingrese su usuario"
                        autocomplete="username" required>

                </div>


                <!-- CONTRASEÑA -->

                <div class="form-group">

                    <label for="password" class="form-label">

                        Contraseña

                    </label>

                    <input type="password" id="password" name="password" class="form-input"
                        placeholder="Ingrese su contraseña" autocomplete="current-password" required>

                </div>


                <!-- =================================
                     OPCIONES
                     ================================= -->

                <div class="auth-options">


                    <label class="remember-option">

                        <input type="checkbox" id="remember" name="remember">

                        <span>
                            Recordarme
                        </span>

                    </label>


                    <a href="pages/auth/restablecer_clave.html" class="auth-link">

                        ¿Olvidó su contraseña?

                    </a>

                </div>


                <!-- =================================
                     BOTÓN
                     ================================= -->

                <button type="submit" class="btn btn-primary">

                    <span aria-hidden="true">
                        ⇥
                    </span>

                    <span>
                        Ingresar al sistema
                    </span>

                </button>


            </form>




            <!-- =====================================
                 SEPARADOR
                 ===================================== -->

            <div class="auth-divider" aria-hidden="true">

                <span>
                    o
                </span>

            </div>


            <!-- =====================================
                 SOLICITAR ACCESO
                 ===================================== -->

            <button type="button" class="btn btn-secondary" id="requestAccessButton">

                <span aria-hidden="true">
                    +
                </span>

                <span>
                    Solicitar acceso
                </span>

            </button>


        </section>

    </main>


    <!-- =========================================
         FOOTER
         ========================================= -->

    <div id="auth-footer-container"></div>

    <!-- =========================================
         JAVASCRIPT
         ========================================= -->

    <script src="js/auth.js"></script>
</body>

</html>
