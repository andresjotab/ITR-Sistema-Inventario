<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>I.T.R. - Vender</title>

    <!-- CSS Principal -->
    <link rel="stylesheet" href="../../css/variables.css">
    <link rel="stylesheet" href="../../css/reset.css">
    <link rel="stylesheet" href="../../css/global.css">
    <link rel="stylesheet" href="../../css/buttons.css">
    <link rel="stylesheet" href="../../css/modal.css">
    <link rel="stylesheet" href="../../css/pages.css">
</head>

<body data-page="productos">

    <!-- Header y Sidebar se cargan automáticamente -->
    <div id="header-container"></div>

    <div class="app-layout">
        <div id="sidebar-container"></div>

        <main class="main-content">
            <div class="container">

                <!-- Encabezado -->
                <header class="product-page-header">
                    <a href="productos.html" class="back-link">← Volver a Productos</a>
                    <h1>🛒 Vender</h1>
                    <p class="text-muted">Registro de venta de productos del inventario</p>
                </header>

                <!-- Formulario de venta -->
                <div class="product-form-wrapper">
                    <form id="formVenta" method="POST" action="#">

                        <!-- Datos de la factura -->
                        <div class="product-form-row">
                            <div class="form-group">
                                <label for="numeroFactura">Número de factura *</label>
                                <input type="text" id="numeroFactura" name="numero_factura" value="F-001" required>
                            </div>
                            <div class="form-group">
                                <label for="fechaVenta">Fecha *</label>
                                <input type="date" id="fechaVenta" name="fecha_venta" value="2025-08-14" required>
                            </div>
                        </div>

                        <div class="product-form-row">
                            <div class="form-group">
                                <label for="clienteVenta">Cliente *</label>
                                <input type="text" id="clienteVenta" name="cliente" placeholder="Nombre del cliente" required>
                            </div>
                            <div class="form-group">
                                <label for="vendedorVenta">Vendedor *</label>
                                <select id="vendedorVenta" name="vendedor_id" required>
                                    <option value="">Seleccione</option>
                                </select>
                            </div>
                        </div>

                        <!-- Productos vendidos -->
                        <div class="form-group">

                            <!-- Selector para agregar productos a la venta -->
                            <div class="product-form-row venta-agregar">
                                <div class="form-group">
                                    <label for="selectProducto">Producto</label>
                                    <select id="selectProducto" name="producto_id" class="form-input">
                                        <option value="">Seleccione</option>
                                    </select>
                                </div>
                                <div class="form-group">
                                    <label for="inputCantidad">Cantidad</label>
                                    <input type="number" id="inputCantidad" name="cantidad" class="form-input" value="1" min="1">
                                </div>
                                <div class="form-group venta-agregar-btn">
                                    <button type="button" class="btn btn-primary" id="btnAgregarProducto">➕
                                        Agregar</button>
                                </div>
                            </div>

                            <!-- Tabla de productos agregados -->
                            <div class="table-container">
                                <table class="table" id="tablaProductos">
                                    <thead>
                                        <tr>
                                            <th>N° Factura</th>
                                            <th>Fecha</th>
                                            <th>Cliente</th>
                                            <th>Vendedor</th>
                                            <th>Producto</th>
                                            <th>Cantidad</th>
                                            <th>Precio individual</th>
                                            <th>Subtotal</th>
                                            <th>Acciones</th>
                                        </tr>
                                    </thead>
                                    <tbody id="tablaProductosBody"></tbody>
                                </table>
                                <div class="table-footer" id="sinProductos">
                                    No hay productos agregados a la venta
                                </div>
                            </div>
                        </div>

                        <!-- Total por cliente -->
                        <div class="product-form-row venta-total">
                            <div class="form-group">
                                <label>Total por cliente</label>
                                <input type="text" id="totalVenta" value="&#36;0" readonly class="form-input">
                            </div>
                        </div>

                        <div class="product-form-actions">
                            <a href="productos.html" class="btn btn-secondary">Cancelar</a>
                            <button type="submit" class="btn btn-success">💾 Registrar venta</button>
                        </div>
                    </form>
                </div>

            </div>
        </main>
    </div>

    <div id="footer-container"></div>

    <script src="../../js/app.js"></script>
    <script src="../../js/navigation.js"></script>
    <script src="../../js/data.js"></script>
    <script>
        // Catálogo de productos: única fuente de verdad en DataService (js/data.js)
        const PRODUCTOS = Object.fromEntries(
            DataService.getProductos().map(p => [p.codigo, { nombre: p.nombre, precio: p.precio, stock: p.stock }])
        );

        function opcionesProductos() {
            return Object.keys(PRODUCTOS).map(cod =>
                `<option value="${cod}" data-precio="${PRODUCTOS[cod].precio}" data-stock="${PRODUCTOS[cod].stock}">${cod} - ${PRODUCTOS[cod].nombre} (Stock: ${PRODUCTOS[cod].stock})</option>`
            ).join('');
        }

        function opcionesVendedores() {
            return DataService.getUsuarios()
                .filter(u => u.estado === 'Activo')
                .map(u => `<option>${u.nombre}</option>`)
                .join('');
        }

        // Lee los datos de la factura desde el formulario
        function datosFactura() {
            return {
                numero: document.getElementById('numeroFactura').value.trim(),
                fecha: document.getElementById('fechaVenta').value,
                cliente: document.getElementById('clienteVenta').value.trim(),
                vendedor: document.getElementById('vendedorVenta').value
            };
        }

        // Agrega el producto seleccionado a la tabla de la venta
        function agregarProducto() {
            const select = document.getElementById('selectProducto');
            const cantidad = parseInt(document.getElementById('inputCantidad').value) || 1;
            const codigo = select.value;

            if (!codigo) {
                alert('⚠️ Seleccione un producto para agregar');
                return;
            }

            const producto = PRODUCTOS[codigo];
            const tbody = document.getElementById('tablaProductosBody');
            const factura = datosFactura();

            // Valida que la cantidad no supere el stock disponible
            if (cantidad > producto.stock) {
                alert(`⚠️ Solo hay ${producto.stock} unidades disponibles de ${producto.nombre}`);
                return;
            }

            // Si el producto ya está en la tabla, se suma la cantidad
            const filaExistente = tbody.querySelector(`tr[data-codigo="${codigo}"]`);
            if (filaExistente) {
                const tdCant = filaExistente.querySelector('.td-cantidad');
                tdCant.textContent = parseInt(tdCant.textContent) + cantidad;
                actualizarFila(filaExistente);
            } else {
                const tr = document.createElement('tr');
                tr.dataset.codigo = codigo;
                tr.dataset.precio = producto.precio;
                tr.innerHTML = `
                    <td>${factura.numero}</td>
                    <td>${factura.fecha}</td>
                    <td>${factura.cliente}</td>
                    <td>${factura.vendedor}</td>
                    <td>${codigo} - ${producto.nombre}</td>
                    <td class="td-cantidad">${cantidad}</td>
                    <td>\u0024${producto.precio.toFixed(2)}</td>
                    <td class="td-subtotal">\u0024${(cantidad * producto.precio).toFixed(2)}</td>
                    <td>
                        <button type="button" class="btn btn-danger btn-sm btn-quitar" title="Quitar producto">🗑️</button>
                    </td>
                `;
                tbody.appendChild(tr);
            }

            // Reinicia el selector
            select.value = '';
            document.getElementById('inputCantidad').value = 1;
            calcularTotal();
            actualizarEstadoTabla();
        }

        // Recalcula el subtotal de una fila de la tabla
        function actualizarFila(tr) {
            const cantidad = parseInt(tr.querySelector('.td-cantidad').textContent) || 0;
            const precio = parseFloat(tr.dataset.precio) || 0;
            tr.querySelector('.td-subtotal').textContent = '\u0024' + (cantidad * precio).toFixed(2);
        }

        // Recalcula el total de la venta
        function calcularTotal() {
            let total = 0;
            document.querySelectorAll('#tablaProductosBody tr').forEach(tr => {
                const cantidad = parseInt(tr.querySelector('.td-cantidad').textContent) || 0;
                const precio = parseFloat(tr.dataset.precio) || 0;
                total += cantidad * precio;
            });
            document.getElementById('totalVenta').value = '\u0024' + total.toFixed(2);
        }

        // Muestra u oculta el mensaje de tabla vacía
        function actualizarEstadoTabla() {
            const tbody = document.getElementById('tablaProductosBody');
            const vacio = document.getElementById('sinProductos');
            vacio.style.display = tbody.children.length === 0 ? '' : 'none';
        }

        // Al seleccionar un producto, carga su stock en el campo Cantidad
        document.getElementById('selectProducto').addEventListener('change', function () {
            const stock = parseInt(this.selectedOptions[0].dataset.stock) || 1;
            document.getElementById('inputCantidad').value = stock;
        });

        // Agregar producto con el botón
        document.getElementById('btnAgregarProducto').addEventListener('click', agregarProducto);

        // Agregar producto con la tecla Enter en el selector o la cantidad
        document.getElementById('selectProducto').addEventListener('keydown', function (e) {
            if (e.key === 'Enter') {
                e.preventDefault();
                agregarProducto();
            }
        });
        document.getElementById('inputCantidad').addEventListener('keydown', function (e) {
            if (e.key === 'Enter') {
                e.preventDefault();
                agregarProducto();
            }
        });

        // Cambiar cantidad o quitar producto desde la tabla
        document.getElementById('tablaProductosBody').addEventListener('input', function (e) {
            if (e.target.classList.contains('input-cantidad')) {
                actualizarFila(e.target.closest('tr'));
                calcularTotal();
            }
        });

        document.getElementById('tablaProductosBody').addEventListener('click', function (e) {
            if (e.target.classList.contains('btn-quitar')) {
                e.target.closest('tr').remove();
                calcularTotal();
                actualizarEstadoTabla();
            }
        });

        // Inicialización: llena los selectores desde DataService
        document.getElementById('selectProducto').insertAdjacentHTML('beforeend', opcionesProductos());
        document.getElementById('vendedorVenta').insertAdjacentHTML('beforeend', opcionesVendedores());

        // Registrar venta
        document.getElementById('formVenta').addEventListener('submit', function (e) {
            e.preventDefault();
            const factura = datosFactura();
            if (!factura.numero || !factura.fecha || !factura.cliente || !factura.vendedor) {
                alert('⚠️ Complete los datos de la factura (número, fecha, cliente y vendedor)');
                return;
            }
            const filas = document.querySelectorAll('#tablaProductosBody tr');
            if (filas.length === 0) {
                alert('⚠️ Agregue al menos un producto a la venta');
                return;
            }
            alert('✅ Venta registrada correctamente');
        });
    </script>

</body>

</html>
