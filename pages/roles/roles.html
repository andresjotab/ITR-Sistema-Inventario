<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>I.T.R. - Gestión de Roles</title>

    <link rel="stylesheet" href="../../css/variables.css">
    <link rel="stylesheet" href="../../css/reset.css">
    <link rel="stylesheet" href="../../css/global.css">
    <link rel="stylesheet" href="../../css/buttons.css">
    <link rel="stylesheet" href="../../css/modal.css">
    <link rel="stylesheet" href="../../css/pages.css">
</head>

<body data-page="roles">

    <div id="header-container"></div>

    <div class="app-layout">
        <div id="sidebar-container"></div>

        <main class="main-content">
            <div class="container">

                <header class="product-page-header">
                    <h1>👥 Gestión de Roles</h1>
                    <p class="text-muted">Roles y permisos asignados para el uso de la plataforma</p>
                </header>

                <!-- =========================================
                     FILTROS DE BÚSQUEDA
                     ========================================= -->
                <div class="product-form-wrapper">
                    <div class="form-row">
                        <div class="form-group">
                            <label>🔍 Buscar por nombre</label>
                            <input type="text" id="buscar-roles" class="form-input" placeholder="Nombre del rol...">
                        </div>
                        <div class="form-group">
                            <label>📌 Estado</label>
                            <select class="form-input">
                                <option value="">Todos</option>
                                <option>Activo</option>
                                <option>Inactivo</option>
                                <option>Eliminado</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label>📅 Desde</label>
                            <input type="date" class="form-input">
                        </div>
                        <div class="form-group">
                            <label>📅 Hasta</label>
                            <input type="date" class="form-input">
                        </div>
                    </div>
                    <div class="product-form-actions">
                        <button type="button" class="btn btn-secondary">🧹 Limpiar</button>
                        <button type="button" class="btn btn-primary">🔎 Buscar</button>
                        <a href="nuevo_rol.html" class="btn btn-success">✨ Nuevo Rol</a>
                    </div>
                </div>                <!-- =========================================
                     LISTADO DE ROLES
                     ========================================= -->
                <div class="product-table-wrapper" aria-label="Tabla de roles">
                    <table class="product-table">
                        <thead>
                            <tr>
                                <th>ID</th>
                                <th>Nombre</th>
                                <th>Descripción</th>
                                <th>Estado</th>
                                <th>Creado</th>
                                <th>Acciones</th>
                            </tr>
                        </thead>
                        <tbody id="roles-tbody"></tbody>
                    </table>

                    <!-- Paginación -->
                    <div class="product-table-footer">
                        <span id="paginacion-info-roles">Mostrando 0-0 de 0</span>
                        <div class="pagination" id="paginacion-botones-roles"></div>
                    </div>
                </div>

            </div>
        </main>
    </div>

    <div id="footer-container"></div>
    <!-- Modal eliminar rol -->
    <div class="modal-overlay" id="modalEliminar">
        <div class="modal" role="dialog" aria-modal="true" aria-labelledby="modalEliminarTitle">
            <div class="modal-header">
                <h2 id="modalEliminarTitle">Eliminar Rol</h2>
                <button type="button" class="modal-close" data-cerrar-modal aria-label="Cerrar ventana">×</button>
            </div>
            <div class="modal-body">
                <div class="modal-icon">⚠️</div>
                <p>¿Estás seguro de eliminar este rol? Esta acción no se puede deshacer.</p>
                <div class="product-details">
                    <strong>ID:</strong> <span id="codigoRol">---</span><br>
                    <strong>Nombre:</strong> <span id="nombreRol">---</span>
                </div>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary btn-sm" data-cerrar-modal>Cancelar</button>
                <button type="button" class="btn btn-danger btn-sm" id="btnConfirmarEliminarRol">Eliminar</button>
            </div>
        </div>
    </div>

    <script src="../../js/app.js"></script>
    <script src="../../js/navigation.js"></script>
    <script src="../../js/data.js"></script>
    <script src="../../js/roles.js"></script>

</body>
</html>
