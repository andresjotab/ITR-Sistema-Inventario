<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>I.T.R. - Editar Rol</title>

    <link rel="stylesheet" href="../../css/variables.css">
    <link rel="stylesheet" href="../../css/reset.css">
    <link rel="stylesheet" href="../../css/global.css">
    <link rel="stylesheet" href="../../css/buttons.css">
    <link rel="stylesheet" href="../../css/modal.css">
    <link rel="stylesheet" href="../../css/pages.css">
</head>

<body data-page="roles">

    <div id="header-container"></div>

    <div class="app-layout">
        <div id="sidebar-container"></div>

        <main class="main-content">
            <div class="container">

                <header class="product-page-header">
                    <a href="roles.html" class="back-link">← Volver</a>
                    <h1>✏️ Editar Rol</h1>
                </header>

                <div class="product-form-wrapper">
                    <form id="formRol" method="POST" action="#">
                        <div class="product-form-row">
                            <div class="form-group">
                                <label for="rol_id">ID *</label>
                                <input type="text" id="rol_id" name="id" value="01" readonly>
                            </div>
                            <div class="form-group">
                                <label for="nombre">Nombre *</label>
                                <input type="text" id="nombre" name="nombre" value="Admin" maxlength="50" required>
                            </div>
                        </div>

                        <div class="product-form-row">
                            <div class="form-group">
                                <label for="estado">Estado *</label>
                                <select id="estado" name="estado" required>
                                    <option value="">Seleccione</option>
                                    <option value="Activo" selected>Activo</option>
                                    <option value="Inactivo">Inactivo</option>
                                </select>
                            </div>
                            <div class="form-group">
                                <label for="creado">Creado</label>
                                <input type="text" id="creado" name="creado" value="14/08/2025" readonly>
                            </div>
                        </div>

                        <div class="form-group">
                            <label for="descripcion">Descripción</label>
                            <textarea id="descripcion" name="descripcion" maxlength="255">Control total del sistema</textarea>
                        </div>

                        <div class="form-group">
                            <label>Permisos asignados</label>
                            <div class="form-row">
                                <label class="remember-option">
                                    <input type="checkbox" name="permisos[]" value="ver_productos" checked> Ver productos
                                </label>
                                <label class="remember-option">
                                    <input type="checkbox" name="permisos[]" value="crear_productos" checked> Crear productos
                                </label>
                                <label class="remember-option">
                                    <input type="checkbox" name="permisos[]" value="editar_productos" checked> Editar productos
                                </label>
                                <label class="remember-option">
                                    <input type="checkbox" name="permisos[]" value="eliminar_productos" checked> Eliminar productos
                                </label>
                                <label class="remember-option">
                                    <input type="checkbox" name="permisos[]" value="ver_reportes" checked> Ver reportes
                                </label>
                                <label class="remember-option">
                                    <input type="checkbox" name="permisos[]" value="gestionar_usuarios" checked> Gestionar usuarios
                                </label>
                            </div>
                        </div>

                        <div class="product-form-actions">
                            <a href="roles.html" class="btn btn-secondary">Cancelar</a>
                            <button type="submit" class="btn btn-success">💾 Actualizar</button>
                        </div>
                    </form>
                </div>

            </div>
        </main>
    </div>

    <div id="footer-container"></div>

    <script src="../../js/app.js"></script>
    <script src="../../js/navigation.js"></script>
    <script>
        document.getElementById('formRol').addEventListener('submit', function (e) {
            e.preventDefault();
            alert('✅ Rol actualizado');
        });
    </script>

</body>

</html>
