<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>I.T.R. - Soporte</title>

    <link rel="stylesheet" href="../../css/variables.css">
    <link rel="stylesheet" href="../../css/reset.css">
    <link rel="stylesheet" href="../../css/global.css">
    <link rel="stylesheet" href="../../css/buttons.css">
    <link rel="stylesheet" href="../../css/modal.css">
    <link rel="stylesheet" href="../../css/pages.css">
</head>
<body data-page="ayuda">

    <!-- Header (se carga dinámicamente desde /components/header.html) -->
    <div id="header-container"></div>

    <!-- Estructura principal -->
    <div class="app-layout">

        <!-- Sidebar (cargado dinámicamente) -->
        <div id="sidebar-container"></div>

        <!-- Contenido principal -->
        <main class="main-content">
            <div class="container">

                <header class="page-header">
                    <h1>❓ Soporte</h1>
                    <p class="subtitle">Envíe su consulta o reporte de incidencia</p>
                </header>

                <div class="soporte-container">

                    <div id="alertSuccess" class="form-message form-message--success" style="display: none; margin-bottom: var(--spacing-md);">
                        ✅ ¡Mensaje enviado correctamente! Nos pondremos en contacto a la brevedad.
                    </div>

                    <form id="soporteForm" method="POST" action="#" enctype="multipart/form-data">
                        <div class="form-group">
                            <label for="nombre" class="form-label">Nombre <span style="color: var(--color-danger);">*</span></label>
                            <input type="text" id="nombre" name="nombre" class="form-input" placeholder="Ingrese su nombre completo" required>
                        </div>

                        <div class="form-group">
                            <label for="correo" class="form-label">Correo electrónico <span style="color: var(--color-danger);">*</span></label>
                            <input type="email" id="correo" name="correo" class="form-input" placeholder="ejemplo@correo.com" required>
                        </div>

                        <div class="form-group">
                            <label for="asunto" class="form-label">Asunto <span style="color: var(--color-danger);">*</span></label>
                            <input type="text" id="asunto" name="asunto" class="form-input" placeholder="Asunto de la consulta" required>
                        </div>

                        <div class="form-group">
                            <label for="mensaje" class="form-label">Mensaje <span style="color: var(--color-danger);">*</span></label>
                            <textarea id="mensaje" name="mensaje" class="form-input" placeholder="Describa detalladamente su consulta o problema..." required></textarea>
                        </div>

                        <div class="form-group">
                            <label class="form-label">Adjuntar archivo <span style="font-weight: 400; color: var(--color-text-light);">(Opcional)</span></label>
                            <div class="file-input-wrapper">
                                <label for="archivo" class="file-label">📎 Seleccionar archivo</label>
                                <input type="file" id="archivo" name="adjunto" accept=".jpg,.jpeg,.png,.pdf,.doc,.docx">
                                <span id="fileName" class="file-name">Ningún archivo seleccionado</span>
                            </div>
                            <div class="file-hint">Formatos: JPG, PNG, PDF, DOC, DOCX (Máx. 5MB)</div>
                        </div>

                        <div class="form-actions">
                            <button type="submit" class="btn btn-primary">📨 Enviar</button>
                            <button type="reset" class="btn btn-secondary">🗑️ Limpiar</button>
                        </div>
                    </form>

                </div>

            </div>
        </main>

    </div>

    <!-- Footer (cargado dinámicamente) -->
    <div id="footer-container"></div>

    <script src="../../js/app.js"></script>
    <script src="../../js/navigation.js"></script>
    <script>
        // Manejo del formulario de soporte (comportamiento mínimo sin dependencia externa)
        (function () {
            const archivo = document.getElementById('archivo');
            const fileLabel = document.querySelector('.file-label');
            const fileName = document.getElementById('fileName');
            const form = document.getElementById('soporteForm');
            const alertSuccess = document.getElementById('alertSuccess');

            // Abrir selector al hacer click en la etiqueta
            if (fileLabel && archivo) {
                fileLabel.addEventListener('click', () => archivo.click());

                archivo.addEventListener('change', () => {
                    if (archivo.files && archivo.files.length > 0) {
                        fileName.textContent = archivo.files[0].name;
                    } else {
                        fileName.textContent = 'Ningún archivo seleccionado';
                    }
                });
            }

            // Envío simulado
            form.addEventListener('submit', function (e) {
                e.preventDefault();

                // Validación básica
                const nombre = document.getElementById('nombre').value.trim();
                const correo = document.getElementById('correo').value.trim();
                const asunto = document.getElementById('asunto').value.trim();
                const mensaje = document.getElementById('mensaje').value.trim();

                if (!nombre || !correo || !asunto || !mensaje) {
                    alert('Por favor complete los campos obligatorios.');
                    return;
                }

                // Mostrar mensaje de éxito (simulado)
                alertSuccess.style.display = 'block';

                // Opcional: limpiar el formulario después de 2s
                setTimeout(() => {
                    form.reset();
                    fileName.textContent = 'Ningún archivo seleccionado';
                    alertSuccess.style.display = 'none';
                }, 2000);

            });

        })();
    </script>

</body>
</html>
